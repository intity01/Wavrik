[project]
name = "wavrik"
version = "2.2.0"
description = "Precision audio analysis, key & BPM estimation, stem separation, and media downloader."
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["N999"]
