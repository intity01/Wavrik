name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            Downloader/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Downloader/requirements-dev.txt

      - name: Compile sources
        working-directory: Downloader
        run: python -m compileall -q src main.py

      - name: Project rules
        working-directory: Downloader
        run: python tools/check_rules.py

      - name: AI-slop check
        working-directory: Downloader
        run: python tools/check_ai_slop.py

      - name: Ruff
        working-directory: Downloader
        run: ruff check src tests

      - name: Pytest
        working-directory: Downloader
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
