name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            Downloader/requirements-dev.txt

      - uses: ./.github/actions/setup-ffmpeg

      - name: Resolve version and verify release configuration
        id: meta
        shell: pwsh
        run: |
          $config = Get-Content "Downloader/src/core/config.py" -Raw
          if ($config -notmatch 'VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"') { throw "Config.VERSION not found." }
          $version = $Matches[1]
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match Config.VERSION $version."
          }
          if ($config -notmatch 'GITHUB_REPO = "([^"]+)"' -or $Matches[1] -ne "${{ github.repository }}") {
            throw "Config.GITHUB_REPO must match ${{ github.repository }} for in-app updates."
          }
          foreach ($f in "LICENSE", "THIRD_PARTY_NOTICES.md") { if (-not (Test-Path $f)) { throw "$f is required in every release." } }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt -r Downloader/requirements-dev.txt

      - name: Run quality gates
        working-directory: Downloader
        run: |
          python -m compileall -q src main.py
          python tools/check_rules.py
          python tools/check_ai_slop.py
          ruff check src tests
          pytest -q

      - name: Build application
        run: pyinstaller --noconfirm --clean MediaDownloaderPRO.spec

      - name: Smoke-test the frozen build
        shell: pwsh
        run: |
          $p = Start-Process "dist/MediaDownloaderPRO/MediaDownloaderPRO.exe" -ArgumentList "--test-startup" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen build failed --test-startup (exit $($p.ExitCode))." }

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @((Get-Command iscc -ErrorAction SilentlyContinue).Source, "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") |
            Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found." }
          $v = "${{ steps.meta.outputs.version }}"
          & $iscc "/DMyAppVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed." }
          Compress-Archive -Path "dist/MediaDownloaderPRO/*" -DestinationPath "dist/MediaDownloaderPRO-v$v-Windows-x64.zip" -Force
          foreach ($a in "dist/MediaDownloaderPRO-v$v-Setup.exe", "dist/MediaDownloaderPRO-v$v-Windows-x64.zip") {
            if (-not (Test-Path $a)) { throw "Missing release asset $a" }
            (Get-FileHash $a -Algorithm SHA256).Hash.ToLower() | Out-File "$a.sha256" -Encoding ascii
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloaderPRO-v${{ steps.meta.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.meta.outputs.version }}"
          $notes = "release-notes.md"
          $section = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -like "[$v]*" } | Select-Object -First 1
          if ($section) { ($section -replace "^\[[^\n]*\n", "").Trim() | Out-File $notes -Encoding utf8 } else { "See CHANGELOG.md" | Out-File $notes -Encoding utf8 }
          gh release create "${{ github.ref_name }}" `
            "dist/MediaDownloaderPRO-v$v-Setup.exe" "dist/MediaDownloaderPRO-v$v-Setup.exe.sha256" `
            "dist/MediaDownloaderPRO-v$v-Windows-x64.zip" "dist/MediaDownloaderPRO-v$v-Windows-x64.zip.sha256" `
            --title "Wavrik · Media Downloader PRO v$v" --notes-file $notes --verify-tag
