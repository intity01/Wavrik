name: Scheduled yt-dlp Compatibility Check

on:
  schedule:
    # 00:00 UTC every Sunday
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-ffmpeg

      - name: Install dependencies with the newest yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Downloader/requirements-dev.txt
          python -m pip install --upgrade yt-dlp

      - name: Run quality gates and tests
        working-directory: Downloader
        run: |
          python -m compileall -q src main.py
          python tools/check_rules.py
          python tools/check_ai_slop.py
          ruff check src tests
          pytest -q
