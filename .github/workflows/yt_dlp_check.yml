name: Scheduled yt-dlp Compatibility Check

on:
  schedule:
    # Runs at 00:00 every Sunday
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp
          python -m pip install -r Downloader/requirements-dev.txt

      - name: Run quality gates & tests
        working-directory: Downloader
        run: |
          python -m compileall -q src main.py
          python tools/check_rules.py
          python tools/check_ai_slop.py
          ruff check src tests
          pytest -v
